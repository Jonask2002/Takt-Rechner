<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Takt-Rechner</title><style>body{font-family:-apple-system,sans-serif;background:#f2f2f7;margin:0}main{max-width:520px;margin:auto;padding:24px 16px}.card{background:white;border-radius:20px;padding:18px;margin-bottom:14px}select,input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:12px;font-size:18px}button{background:#007aff;color:white;border:0;font-weight:bold}.big{font-size:28px;font-weight:bold}</style></head><body><main><h1>⏱️ Takt-Rechner</h1><div class="card"><select id="s"><option value="400">Frühschicht 06:30–13:50</option><option value="410">Spätschicht 14:00–21:30</option></select><select id="t"><option>4</option><option>5</option><option>6</option></select><input id="r" type="number" min="0" max="65" value="30" placeholder="Restzeit in Minuten"><button onclick="calc()">Berechnen</button></div><div class="card" id="o">Ergebnis erscheint hier.</div><div class="card">Taktfolge: 4 → 5 → 6 → 4 …<br>1 Takt = 65 Minuten inkl. 5 Minuten Vorfahren.<br>Früh: Pausen 09:15–09:45 und 11:50–12:00.<br>Spät: Pausen 18:00–18:30 und 20:20–20:30.</div><script>function n(t){return t==6?4:t+1}function calc(){let a=+s.value,t=+document.getElementById("t").value,r=+document.getElementById("r").value;if(r<0||r>65||isNaN(r)){o.innerHTML="Bitte 0–65 Minuten eingeben.";return}if(r==0)r=65;let done=0,rem;if(a<r)rem=r-a;else{a-=r;done++;t=n(t);while(a>=65){a-=65;done++;t=n(t)}rem=a==0?65:65-a}o.innerHTML='Du hörst auf <span class="big">Takt '+t+'</span> auf.<br>Dort bleiben noch <span class="big">'+rem+' Minuten</span> übrig.<br>Vollständig beendete Takte: '+done;}</script></main></body></html>
